spring:
  application:
    name: cleanmate-duty
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cleanmate_duty?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:duty_user}
    password: ${DB_PASSWORD}

server:
  port: 8082

roster:
  auth-url: ${AUTH_URL:http://localhost:8081}
