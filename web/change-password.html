<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경 - 청소 당번 도우미</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="header"></header>

<main>
    <h1>비밀번호 변경</h1>
    <div id="message"></div>

    <form id="change-form" class="card">
        <label for="current-password">현재 비밀번호</label>
        <input type="password" id="current-password" autocomplete="current-password" required>

        <label for="new-password">새 비밀번호</label>
        <input type="password" id="new-password" autocomplete="new-password" required>

        <label for="new-password-confirm">새 비밀번호 확인</label>
        <input type="password" id="new-password-confirm" autocomplete="new-password" required>

        <div class="actions">
            <button type="submit">변경</button>
        </div>
    </form>
</main>

<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
