spring:
  application:
    name: cleanmate-auth
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cleanmate_auth?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000

server:
  port: 8081

duty:
  url: ${DUTY_URL:http://localhost:8082}
